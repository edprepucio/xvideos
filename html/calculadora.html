<!DOCTYPE html>
<html lang="en">
    <head>
        <title>calculadora</title>
        <link rel="icon" href="../img/pngegg.png" type="image/x-icon"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">
        <script src="../js/funciones.js"></script>
    </head>
<body>
          <div class="logo">
      <img src="../img/logo.png ">
      </div>
    <h1>Ejemplo de calculadora</h1>
     <div class="d-grid gap-2 col-6 mx-auto">
    <label for="num1" class="form-label">Num. 1</label>
    <input type="number" class="form-control" id="num1" placeholder="Ingrese el primer número">
  </div>
       <div class="d-grid gap-2 col-6 mx-auto">
    <label for="num2" class="form-label">Num. 2</label>
    <input type="number" class="form-control" id="num2" placeholder="Ingrese el segundo número">
  </div>
         <div class="d-grid gap-2 col-6 mx-auto">
    <label for="num3" class="form-label">Num. 3</label>
    <input type="number" class="form-control" id="num3" placeholder="Ingrese el tercer número">
  </div>

<div class="d-grid gap-2 col-6 mx-auto">
  <button class="btn btn-primary" type="button" onclick="calcular('+')">+</button>
  <button class="btn btn-primary" type="button" onclick="calcular('-')">-</button>
  <button class="btn btn-primary" type="button" onclick="calcular('*')">x</button>
  <button class="btn btn-primary" type="button" onclick="calcular('/')">/</button>
</div>
<h1 id="resultado" class="text-center mt-3">Resultado:</h1>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
