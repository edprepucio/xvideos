<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Storage</title>
    <link rel="icon" href="../img/pngegg.png" type="image/x-icon" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/funciones.js"></script>
    <style>
      table {
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th,
      td {
        padding: 6px 10px;
        border: 1px solid #999;
      }
      td input {
        width: 100%;
        box-sizing: border-box;
      }
      td.acciones {
        white-space: nowrap;
      }
      #estado {
        margin: 0.5rem 0;
        min-height: 1.2em;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>Registros</h1>
    <div id="estado"></div>
    <table id="tabla"></table>

    <script>
      const API_URL =
        "https://script.google.com/macros/s/AKfycbyu7IIAJVeFxYkxaPccv9tr43T_XkNohPRMz72GaKrxUx9YeQHSUXOofjCr0X8VPPxq/exec";
      const TOKEN = "sergio";

      const tabla = document.getElementById("tabla");
      const estado = document.getElementById("estado");

      let encabezados = [];
      let filasActuales = [];

      function cargar() {
        estado.textContent = "Cargando...";

        fetch(API_URL + "?token=" + TOKEN)
          .then((res) => res.json())
          .then((datos) => {
            encabezados = datos.headers;
            filasActuales = datos.rows;
            dibujarTabla();
            estado.textContent = "";
          })
          .catch(() => {
            estado.textContent = "Error al cargar los datos";
          });
      }

      function dibujarTabla() {
        let html = "<tr>";

        for (let i = 0; i < encabezados.length; i++) {
          html += "<th>" + encabezados[i] + "</th>";
        }
        html += "<th>Acciones</th></tr>";

        for (let i = 0; i < filasActuales.length; i++) {
          const fila = filasActuales[i];
          html += "<tr>";

          for (let j = 0; j < fila.values.length; j++) {
            html += "<td>" + fila.values[j] + "</td>";
          }

          html +=
            "<td>" +
            "<button onclick='editar(" +
            i +
            ")'>Editar</button> " +
            "<button onclick='eliminar(" +
            fila.row +
            ")'>Eliminar</button>" +
            "</td></tr>";
        }

        tabla.innerHTML = html;
      }

      function enviar(datos) {
        datos.token = TOKEN;

        return fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(datos),
        }).then((res) => res.json());
      }

      function agregar() {
        const valores = [];

        for (let i = 0; i < encabezados.length; i++) {
          const dato = prompt("Ingresa " + encabezados[i] + ":");
          if (dato === null) return;
          valores.push(dato);
        }

        enviar({ action: "create", values: valores }).then(cargar);
      }

      function editar(posicion) {
        const fila = filasActuales[posicion];
        const valores = [];

        for (let i = 0; i < encabezados.length; i++) {
          const dato = prompt("Editar " + encabezados[i] + ":", fila.values[i]);
          if (dato === null) return;
          valores.push(dato);
        }

        enviar({ action: "update", row: fila.row, values: valores }).then(
          cargar,
        );
      }

      function eliminar(numeroFila) {
        if (confirm("¿Seguro que quieres eliminar esta fila?")) {
          enviar({ action: "delete", row: numeroFila }).then(cargar);
        }
      }

      cargar();
    </script>
  </body>
</html>
