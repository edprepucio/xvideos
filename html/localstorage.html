<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage</title>
    <link rel="icon" href="../img/pngegg.png" type="image/x-icon"/>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        table { border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 6px 10px; border: 1px solid #999; }
        td input { width: 100%; box-sizing: border-box; }
        td.acciones { white-space: nowrap; }
        #estado { margin: .5rem 0; min-height: 1.2em; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <h1>Registros</h1>
    <div id="estado"></div>
    <table id="tabla"></table>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyu7IIAJVeFxYkxaPccv9tr43T_XkNohPRMz72GaKrxUx9YeQHSUXOofjCr0X8VPPxq/exec";
        const TOKEN = "sergio";

        const tabla = document.getElementById("tabla");
        const estado = document.getElementById("estado");
        let headers = [];

        function msg(texto, esError = false) {
            estado.textContent = texto;
            estado.className = esError ? "error" : "";
        }

        async function api(payload) {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ token: TOKEN, ...payload })
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "Error desconocido");
            return data;
        }

        async function cargar() {
            msg("Cargando...");
            try {
                const res = await fetch(`${API_URL}?token=${encodeURIComponent(TOKEN)}`);
                const data = await res.json();
                if (!data.ok) throw new Error(data.error);
                headers = data.headers;
                render(data.rows);
                msg("");
            } catch (err) {
                msg("Error al cargar: " + err.message, true);
            }
        }

        function crearFilaTexto(valores, rowNum) {
            const tr = document.createElement("tr");
            valores.forEach(v => {
                const td = document.createElement("td");
                td.textContent = v;
                tr.appendChild(td);
            });
            const acc = document.createElement("td");
            acc.className = "acciones";

            const btnEditar = document.createElement("button");
            btnEditar.textContent = "Editar";
            btnEditar.onclick = () => modoEdicion(tr, valores, rowNum);

            const btnBorrar = document.createElement("button");
            btnBorrar.textContent = "Eliminar";
            btnBorrar.onclick = async () => {
                if (!confirm("¿Eliminar esta fila?")) return;
                try {
                    msg("Eliminando...");
                    await api({ action: "delete", row: rowNum });
                    await cargar();
                } catch (err) { msg("Error: " + err.message, true); }
            };

            acc.append(btnEditar, " ", btnBorrar);
            tr.appendChild(acc);
            return tr;
        }

        function modoEdicion(tr, valores, rowNum) {
            tr.innerHTML = "";
            const inputs = valores.map(v => {
                const td = document.createElement("td");
                const inp = document.createElement("input");
                inp.value = v;
                td.appendChild(inp);
                tr.appendChild(td);
                return inp;
            });
            const acc = document.createElement("td");
            acc.className = "acciones";

            const btnGuardar = document.createElement("button");
            btnGuardar.textContent = "Guardar";
            btnGuardar.onclick = async () => {
                try {
                    msg("Guardando...");
                    await api({ action: "update", row: rowNum, values: inputs.map(i => i.value) });
                    await cargar();
                } catch (err) { msg("Error: " + err.message, true); }
            };

            const btnCancelar = document.createElement("button");
            btnCancelar.textContent = "Cancelar";
            btnCancelar.onclick = () => {
                tr.replaceWith(crearFilaTexto(valores, rowNum));
            };

            acc.append(btnGuardar, " ", btnCancelar);
            tr.appendChild(acc);
        }

        function filaNueva() {
            const tr = document.createElement("tr");
            const inputs = headers.map(h => {
                const td = document.createElement("td");
                const inp = document.createElement("input");
                inp.placeholder = h;
                td.appendChild(inp);
                tr.appendChild(td);
                return inp;
            });
            const acc = document.createElement("td");
            const btn = document.createElement("button");
            btn.textContent = "Agregar";
            btn.onclick = async () => {
                const valores = inputs.map(i => i.value);
                if (valores.every(v => v.trim() === "")) return msg("Completa al menos un campo", true);
                try {
                    msg("Agregando...");
                    await api({ action: "create", values: valores });
                    await cargar();
                } catch (err) { msg("Error: " + err.message, true); }
            };
            acc.appendChild(btn);
            tr.appendChild(acc);
            return tr;
        }

        function render(rows) {
            tabla.innerHTML = "";
            const thead = document.createElement("tr");
            headers.forEach(h => {
                const th = document.createElement("th");
                th.textContent = h;
                thead.appendChild(th);
            });
            const thAcc = document.createElement("th");
            thAcc.textContent = "Acciones";
            thead.appendChild(thAcc);
            tabla.appendChild(thead);

            rows.forEach(r => tabla.appendChild(crearFilaTexto(r.values, r.row)));
            tabla.appendChild(filaNueva());
        }

        cargar();
    </script>
</body>
</html>
