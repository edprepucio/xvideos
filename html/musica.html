<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HACE CALOR - Música</title>
    <link
      rel="icon"
      href="https://static.wikia.nocookie.net/ficcion-sin-limites/images/c/c3/2hu.png/revision/latest?cb=20210114081823&path-prefix=es"
      type="image/x-icon"
    />

    <style>
      body {
        background-color: #dadeb5;
        margin: 0;
        padding: 40px 20px;
        font-family: "MS Gothic", "Courier New", Courier, monospace;
        font-size: 13px;
        font-weight: bold;
        color: #000000;
        text-align: center;
      }

      h1 {
        font-size: 24px;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }

      p {
        line-height: 1.5;
        margin: 4px 0 20px;
      }

      .boton-volver {
        display: inline-block;
        margin-bottom: 20px;
        padding: 6px 14px;
        background-color: #ffffff;
        color: #000000;
        text-decoration: none;
        border: 2px solid #000000;
        box-shadow: 3px 3px 0px #000000;
        transition: transform 0.15s ease;
      }

      .boton-volver:hover {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #000000;
      }

      .contenedor_fotos {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
        gap: 20px;
        margin-top: 25px;
      }

      .caja {
        background-color: #ffffff;
        border: 2px solid #000000;
        padding: 10px;
        width: 170px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        text-decoration: none;
        color: #000000;
        box-shadow: 3px 3px 0px #000000;
      }

      .caja:hover {
        transform: scale(1.03);
        transition: transform 0.2s ease;
      }

      /* Marco cuadrado para discos */
      .marco {
        border: 2px solid #000000;
        width: 130px;
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #ffffff;
        margin-bottom: 8px;
      }

      .marco img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .caja h3 {
        margin: 6px 0 2px;
        font-size: 12px;
      }

      .caja span {
        font-size: 11px;
        font-weight: normal;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="boton-volver">← VOVLER XD</a>

    <h1>ÁLBUMES Y MÚSICA</h1>
    <p>la musica es mi mayor pasion i amor</p>
  </body>
</html>
